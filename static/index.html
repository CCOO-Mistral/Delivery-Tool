<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climeon Delivery Management Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="bg"></div>
<header id="topbar">
  <div id="logo" onclick="location.hash='#/'">
    <img src="/static/img/logo.png" alt="Climeon" class="logo-img">
    <span class="logo-sub"><em>Delivery Management</em></span>
  </div>
  <div id="topbar-right">
    <span id="user-label"></span>
    <a class="btn ghost" id="backup-btn" href="/api/backup" title="Download a backup copy of the database (all project data). Turns red when more than 7 days have passed since the last backup download.">⬇ Backup</a>
    <button class="btn ghost" id="wiki-btn" title="Delivery Management wiki">Wiki</button>
  </div>
</header>
<div id="layout">
  <nav id="sidebar"></nav>
  <main id="main"><div class="loading">Loading…</div></main>
</div>
<aside id="wiki-drawer" class="hidden"></aside>
<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
