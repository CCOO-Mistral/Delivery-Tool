<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climeon Delivery Management Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="bg"></div>
<header id="topbar">
  <div id="logo" onclick="location.hash='#/'">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#8fd14f" stroke-width="2.5"/>
      <path d="M8 18 q4 -6 8 0 t8 0" fill="none" stroke="#ffffff" stroke-width="2"/>
    </svg>
    <span>CLIMEON <em>Delivery Management</em></span>
  </div>
  <div id="topbar-right">
    <span id="user-label"></span>
    <button class="btn ghost" id="wiki-btn" title="Delivery Management wiki">Wiki</button>
  </div>
</header>
<div id="layout">
  <nav id="sidebar"></nav>
  <main id="main"><div class="loading">Loading…</div></main>
</div>
<aside id="wiki-drawer" class="hidden"></aside>
<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
